name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

# Org policy: GitHub-owned actions only, pinned to a commit SHA.
# AWS auth exchanges the OIDC token directly (scripts/ci-aws-login.sh).
permissions:
  id-token: write
  contents: read

concurrency:
  group: discord-mcp-deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: ci
    # AgentCore Runtime needs an arm64 image.
    runs-on: ubuntu-24.04-arm
    environment: aws # vars are only populated in the environment
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      ROLE_ARN: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-discord-mcp
      READ_ONLY: ${{ vars.DISCORD_READ_ONLY }}
      ALLOWED_GUILDS: ${{ vars.DISCORD_ALLOWED_GUILDS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: AWS credentials (OIDC)
        run: ./scripts/ci-aws-login.sh
      - run: npm run deploy
